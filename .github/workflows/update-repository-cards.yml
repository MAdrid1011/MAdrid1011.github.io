name: Update repository cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.repository == 'MAdrid1011/MAdrid1011.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"

      - name: Refresh local cards
        run: ruby scripts/update_repository_cards.rb

      - name: Commit refreshed cards
        run: |
          if git diff --quiet -- assets/img/repositories; then
            echo "Repository cards are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/repositories
          git commit -m "Update repository cards"
          git pull --rebase origin main
          git push origin HEAD:main
